<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre visite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#3B5A45;
    --accent-soft:#EAF0E8;
    --ivory:#FAF8F4;
    --paper:#FFFFFF;
    --ink:#221F1B;
    --ink-soft:#75706A;
    --line:#E7E3DB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--ivory);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:440px;
    padding:56px 26px 40px;
    text-align:center;
  }
  .badge{
    width:60px;height:60px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:21px;
    margin:0 auto 20px;
  }
  .headline{
    font-family:'Fraunces',serif;font-weight:700;font-size:28px;line-height:1.25;
    margin:0 0 6px;letter-spacing:-0.01em;
  }
  .sub{font-size:14px;color:var(--ink-soft);margin:0 0 34px;}

  .shares{display:flex;flex-direction:column;gap:12px;margin-bottom:30px;}
  .share{
    display:flex;align-items:center;gap:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 17px;
    text-decoration:none;
    color:var(--ink);
    transition:transform 0.15s ease;
    text-align:left;
  }
  .share:active{transform:scale(0.97);}
  .share-icon{
    width:40px;height:40px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .share-title{font-size:15px;font-weight:600;}
  .share-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .share-arrow{margin-left:auto;color:var(--ink-soft);font-size:16px;flex-shrink:0;}

  .icon-google{background:#EEF3FC;}
  .icon-whatsapp{background:#E6F6ED;}
  .icon-instagram{background:var(--accent-soft);}

  .footer{
    font-size:11.5px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .footer b{color:var(--ink);font-weight:600;}

  .empty{
    padding:80px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.7;
  }
  .empty code{
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:2px 6px;font-size:12px;
  }
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
var params = new URLSearchParams(window.location.search);
var name = params.get('name');
var initials = (params.get('initials') || '').toUpperCase();
var color = params.get('color');
var google = params.get('google');
var wa = params.get('wa');
var insta = params.get('insta');

var page = document.getElementById('page');

if(!name && !google && !wa && !insta){
  page.innerHTML =
    '<div class="empty">' +
    'Cette page se personnalise via les paramètres d\'URL.<br><br>' +
    'Exemple : <code>?name=Café+Martin&initials=CM&color=3B5A45&google=LIEN&wa=336...&insta=pseudo</code>' +
    '</div>';
} else {
  if(color){
    document.documentElement.style.setProperty('--accent', '#' + color.replace('#',''));
  }
  if(!initials && name){ initials = name.trim().slice(0,2).toUpperCase(); }

  var html = '';
  html += '<div class="badge">' + (initials || '·') + '</div>';
  html += '<p class="headline">Merci pour<br>votre visite <span style="color:#C24545">❤</span></p>';
  html += '<p class="sub">' + (name ? 'chez ' + escapeHtml(name) : '') + '</p>';
  html += '<div class="shares">';

  if(google){
    html += '<a class="share" href="' + escapeAttr(google) + '" target="_blank" rel="noopener">' +
      '<div class="share-icon icon-google">' + googleSvg() + '</div>' +
      '<div><div class="share-title">Laisser un avis Google</div><div class="share-sub">Ça prend 20 secondes</div></div>' +
      '<span class="share-arrow">›</span></a>';
  }
  if(wa){
    var waMsg = encodeURIComponent('Je vous recommande ' + (name || 'cet endroit') + ' !');
    html += '<a class="share" href="https://wa.me/' + wa.replace(/[^0-9]/g,'') + '?text=' + waMsg + '" target="_blank" rel="noopener">' +
      '<div class="share-icon icon-whatsapp">' + waSvg() + '</div>' +
      '<div><div class="share-title">Recommander sur WhatsApp</div><div class="share-sub">Envoyer à un ami</div></div>' +
      '<span class="share-arrow">›</span></a>';
  }
  if(insta){
    html += '<a class="share" href="https://instagram.com/' + insta.replace('@','') + '" target="_blank" rel="noopener">' +
      '<div class="share-icon icon-instagram">' + igSvg() + '</div>' +
      '<div><div class="share-title">Nous suivre sur Instagram</div><div class="share-sub">@' + escapeHtml(insta.replace('@','')) + '</div></div>' +
      '<span class="share-arrow">›</span></a>';
  }

  html += '</div>';
  html += '<div class="footer">Propulsé par <b>Softkale</b></div>';

  page.innerHTML = html;
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeAttr(s){
  return s.replace(/"/g,'%22');
}
function googleSvg(){
  return '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M14.8 10.2c0-.4 0-.7-.1-1H10v1.9h2.7c-.1.6-.5 1.2-1 1.5v1.3h1.7c1-.9 1.4-2.2 1.4-3.7z" fill="#4285F4"/><path d="M10 15c1.3 0 2.5-.4 3.3-1.2l-1.7-1.3c-.5.3-1 .5-1.6.5-1.3 0-2.3-.8-2.7-2H5.5v1.3C6.3 13.7 8 15 10 15z" fill="#34A853"/><path d="M7.3 11c-.1-.3-.2-.6-.2-1s.1-.7.2-1V7.7H5.5C5.2 8.4 5 9.2 5 10s.2 1.6.5 2.3L7.3 11z" fill="#FBBC05"/><path d="M10 6.8c.7 0 1.4.2 1.9.7l1.5-1.5C12.5 5.1 11.3 4.6 10 4.6c-2 0-3.7 1.3-4.5 3.1l1.8 1.3c.4-1.2 1.4-2 2.7-2z" fill="#EA4335"/></svg>';
}
function waSvg(){
  return '<svg width="19" height="19" viewBox="0 0 24 24" fill="#25D366"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.5.8 3.1 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3C4.1 14.7 4 13.4 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4-.1-.1-.5-1.2-.7-1.7-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 4 3.5.6.2 1 .4 1.3.5.6.2 1.1.1 1.5-.1.5-.2 1.4-.6 1.6-1.1.2-.5.2-.9.1-1-.1-.1-.2-.2-.4-.3z"/></svg>';
}
function igSvg(){
  return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="var(--accent)" stroke="none"/></svg>';
}
</script>
</body>
</html>
